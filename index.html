<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f0f7ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }
        .box {
            background: #fff;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 4px 16px #00000018;
            text-align: center;
        }
        h1 {
            color: #222;
            margin-bottom: 16px;
        }
        p {
            color: #666;
            margin-bottom: 24px;
        }
        button {
            padding: 10px 24px;
            border: none;
            background: #4080ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2969e0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>你好，HTML</h1>
        <p>这是一个简单的静态网页，包含 HTML + CSS</p>
        <button onclick="alert('按钮点击成功！')">点我试试</button>
    </div>
</body>
</html>
